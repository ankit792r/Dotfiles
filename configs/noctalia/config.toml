[theme]
source = "custom"

[shell]
corner_radius_scale = 0
button_borders = false
input_borders = false
popup_borders = false
card_borders = false
show_close_buttons = false
popup_shadows = false
polkit_agent = true

font_family = "Iosevka Nerd Font"
offline_mode = true
setup_wizard_enabled = false

niri_overview_type_to_launch_enabled = true
show_location = false

[shell.animation]
enabled = true
speed = 1.0

[shell.panel]
transparency_mode = "solid"
borders = true
border_color = "outline"
border_width = 1.0
shadow = false
open_near_click_control_center = true
open_near_click_launcher = true
open_near_click_clipboard = true
open_near_click_wallpaper = true
open_near_click_session = true
session_placement = "floating"
session_position = "center"

[shell.session]
grid = true
grid_columns = 1
show_shortcuts = true

[bar.default]
position = "top"
thickness = 30
margin_ends = 0
radius = 0
background_opacity = 1.0
widget_spacing = 14
shadow = false
compositor_blur = false
hover_highlight = false
font_scale = 1.2

start = ["workspaces", "active_window"]
center = ["clock", "media"]
end = ["cpu", "ram", "network", "bluetooth", "battery", "tray"]

[widget.battery]
type = "battery"
device = "auto"
display_mode = "graphic"
show_label = true

[widget.active_window]
min_length = 80
max_length = 260
icon_size = 14
title_scroll = "on_hover"
display = "text_only"
show_empty_label = false

[widget.clock]
type = "clock"
format = "{:%a %d %b  %H:%M}"
scale = 1.0

# CPU usage indicator
[widget.cpu]
type = "sysmon"
stat = "cpu_usage"
visualization = "none"
show_value = true
show_glyph = true

# RAM usage indicator
[widget.ram]
type = "sysmon"
stat = "ram_used"
visualization = "none"
show_value = true
show_glyph = true

[widget.bluetooth]
show_label = true

[widget.media]
album_art_only = false
hide_album_art = true
hide_when_no_media = true

[osd]
position = "top_right"
position_vertical = "top_left"
orientation = "vertical"
hide_delay_ms = 1400
scale = 1.0
background_opacity = 0.97
border = true
border_color = "outline"
border_width = 1
follow_focused_output = false
offset_x = 20
offset_y = 8

[osd.kinds]
volume = true
volume_output = true
volume_input = true
brightness = true
wifi = true
bluetooth = true
power_profile = true
caffeine = true
nightlight = true
dnd = true
lock_keys = true
keyboard_layout = true
media = true
privacy = true
keyboard_backlight = true

[control_center]
sidebar = "none"
sidebar_section = "none"

[wallpaper]
enabled = false


## Services
[nightlight]
temperature_day = 5000
temperature_night = 4000

[audio]
enable_overdrive = false
enable_sounds = false
enable_volume_sounds = false
enable_notification_sounds = false
enable_power_sounds = false
enable_screenshot_sounds = false
