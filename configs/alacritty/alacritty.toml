[general]
import = [
  # "./mocha.toml"
  # "./moonfly.toml"
  # "./rosepine.toml"
  "./vague.toml"
]

[env]
TERM = "xterm-256color"


[font]
size = 15.0

# [font.offset]
# x = 0
# y = 0

[font.normal]
family = "Iosevka Nerd Font"
style = "Regular"

[font.bold]
family = "Iosevka Nerd Font"
style = "Bold"

[font.italic]
family = "Iosevka Nerd Font"
style = "Italic"

[font.bold_italic]
family = "Iosevka Nerd Font"
style = "Bold Italic"


[window]
# padding = { x = 1, y = 0 }
padding = { x = 8, y = 8 }
decorations = "None"
dynamic_padding = true
opacity = 0.75

[cursor]
style = { shape = "Beam", blinking = "On" }

[bell]
animation = "EaseOut"
