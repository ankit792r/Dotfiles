[main]
include=~/.config/foot/vague.ini
term=xterm-256color
# font=Iosevka Nerd Font:size=15

font=IosevkaTerm Nerd Font Mono:size=15:weight=semibold
font-bold=IosevkaTerm Nerd Font Mono:size=15:weight=extrabold
font-italic=IosevkaTerm Nerd Font Mono:size=15:weight=semibold:slant:italic
font-bold-italic=IosevkaTerm Nerd Font Mono:size=15:weight=extrabold:slant:italic
letter-spacing=0px
horizontal-letter-offset=0
vertical-letter-offset=0

box-drawings-uses-font-glyphs=no
initial-window-size-pixels = 1300x800
resize-by-cells=no


initial-window-mode=windowed
workers=0
pad=14x14x14x14 center

[scrollback]
lines=10000
multiplier=7.0

[cursor]
style=block
blink=yes

[key-bindings]
clipboard-copy=Control+Insert Control+Shift+c XF86Copy
primary-paste=none
clipboard-paste=Shift+Insert Control+Shift+v XF86Paste

[text-bindings]
# Send Shift+Return as CSI-u so TUIs can distinguish it from Return.
\x1b[13;2u=Shift+Return
# Send Alt+Shift+Return as CSI-u so tmux can match M-S-Enter.
\x1b[13;4u=Mod1+Shift+Return
