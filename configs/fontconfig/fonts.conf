<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<fontconfig>

  <!-- ========================================= -->
  <!-- Global Rendering Settings -->
  <!-- ========================================= -->

  <match target="font">
    <!-- Enable anti-aliasing -->
    <edit name="antialias" mode="assign">
      <bool>true</bool>
    </edit>

    <!-- Enable hinting -->
    <edit name="hinting" mode="assign">
      <bool>true</bool>
    </edit>

    <!-- hintnone | hintslight | hintmedium | hintfull -->
    <edit name="hintstyle" mode="assign">
      <const>hintslight</const>
    </edit>

    <!-- Sub-pixel rendering -->
    <edit name="rgba" mode="assign">
      <const>rgb</const>
    </edit>

    <!-- LCD filter -->
    <edit name="lcdfilter" mode="assign">
      <const>lcddefault</const>
    </edit>

    <!-- Use font's native hints -->
    <edit name="autohint" mode="assign">
      <bool>false</bool>
    </edit>

    <!-- Disable embedded bitmap fonts -->
    <edit name="embeddedbitmap" mode="assign">
      <bool>false</bool>
    </edit>
  </match>

  <!-- ========================================= -->
  <!-- Sans-serif -->
  <!-- ========================================= -->

  <alias>
    <family>sans-serif</family>
    <prefer>
      <family>Inter Variable</family>
      <family>Inter</family>
      <family>Noto Sans</family>
      <family>DejaVu Sans</family>
    </prefer>
  </alias>

  <!-- ========================================= -->
  <!-- Serif -->
  <!-- ========================================= -->

  <alias>
    <family>serif</family>
    <prefer>
      <family>Source Serif 4</family>
      <family>Source Serif Pro</family>
      <family>Noto Serif</family>
      <family>DejaVu Serif</family>
    </prefer>
  </alias>

  <!-- ========================================= -->
  <!-- Monospace -->
  <!-- ========================================= -->

  <alias>
    <family>monospace</family>
    <prefer>
      <family>Iosevka Term Nerd Font</family>
      <family>Iosevka Nerd Font</family>
      <family>Iosevka Fixed</family>
      <family>JetBrains Mono Nerd Font</family>
      <family>DejaVu Sans Mono</family>
    </prefer>
  </alias>

  <!-- ========================================= -->
  <!-- Emoji -->
  <!-- ========================================= -->

  <alias>
    <family>emoji</family>
    <prefer>
      <family>Noto Color Emoji</family>
    </prefer>
  </alias>

  <!-- Windows emoji fallback -->
  <alias binding="strong">
    <family>Segoe UI Emoji</family>
    <prefer>
      <family>Noto Color Emoji</family>
    </prefer>
  </alias>

  <!-- macOS emoji fallback -->
  <alias binding="strong">
    <family>Apple Color Emoji</family>
    <prefer>
      <family>Noto Color Emoji</family>
    </prefer>
  </alias>

  <!-- ========================================= -->
  <!-- Nerd Font Symbols -->
  <!-- ========================================= -->

  <alias>
    <family>Symbols Nerd Font</family>
    <prefer>
      <family>Iosevka Nerd Font</family>
    </prefer>
  </alias>

  <!-- ========================================= -->
  <!-- Generic Fallback Fonts -->
  <!-- ========================================= -->

  <alias>
    <family>system-ui</family>
    <prefer>
      <family>Inter Variable</family>
      <family>Inter</family>
      <family>Noto Sans</family>
    </prefer>
  </alias>

  <alias>
    <family>ui-sans-serif</family>
    <prefer>
      <family>Inter Variable</family>
      <family>Inter</family>
    </prefer>
  </alias>

  <alias>
    <family>ui-serif</family>
    <prefer>
      <family>Source Serif 4</family>
      <family>Noto Serif</family>
    </prefer>
  </alias>

  <alias>
    <family>ui-monospace</family>
    <prefer>
      <family>Iosevka Term Nerd Font</family>
      <family>Iosevka Nerd Font</family>
    </prefer>
  </alias>

</fontconfig>

